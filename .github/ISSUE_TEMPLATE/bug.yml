name: Bug report / 问题反馈
description: Reproducible connection, terminal, display or notification problem / 连接、终端输入、显示或通知问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach pairing codes, QR codes, device keys or private terminal content. Report security vulnerabilities privately through SECURITY.md. / 请勿附上配对码、二维码、设备密钥或私人终端内容。安全漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: versions
    attributes:
      label: 系统与应用版本 / Versions
      placeholder: macOS 14 arm64 + iOS 17; 或 Windows 11 + Android 14; Code Link 1.4.0
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: 连接方式 / Transport
      options: [USB, Bluetooth, LAN, 不涉及连接 / Not applicable]
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: 终端类型 / Terminal
      placeholder: Windows Terminal + PowerShell; macOS managed zsh; 或 Codex / clink terminal
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: Include the exact order, whether the terminal is minimized, and whether the app is in the background. / 写清操作顺序，以及终端是否最小化、App 是否在后台。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或已脱敏日志 / Screenshots or redacted logs
