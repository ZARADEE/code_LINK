name: Feature request / 功能建议
description: Describe a use case and the operation you want improved / 描述使用场景和希望改善的操作
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: What are you trying to do, and what is difficult today? / 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的操作 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的解决方法 / Current workaround
