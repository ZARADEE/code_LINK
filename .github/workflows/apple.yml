name: Apple builds and checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  apple:
    # Run simulators natively on Apple silicon; cross-build the Intel Mac package.
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install project generator
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Apple packaging and release guards
        run: python3 -m unittest discover -s scripts -p 'test_apple_*.py' -v
      - name: Check terminal rendering acknowledgement
        run: node scripts/test-apple-terminal.cjs
      - name: Build both Mac architectures, iOS simulator and unsigned device archive
        run: bash scripts/build-apple.sh
        env:
          CODELINK_BUILD_ONLY: '1'
      - name: Verify native host and live iPhone and iPad connections
        run: |
          set -o pipefail
          python3 -u scripts/test-apple-host.py "$PWD/.local/apple/mac-$(uname -m)/Build/Products/Release/CodeLink.app" 2>&1 | tee dist/apple/integration.log
      - name: Upload verified Apple packages
        uses: actions/upload-artifact@v4
        with:
          name: CodeLink-Apple-packages
          path: |
            dist/apple/*.zip
            dist/apple/*SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs and real application screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apple-validation
          path: |
            dist/apple/*.log
            dist/apple/*.png
            dist/apple/*.json
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apple
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: CodeLink-Apple-packages
          path: dist/apple
      - name: Publish packages after build, integration and checksum validation
        run: python scripts/publish-apple-release.py dist/apple
        env:
          GITHUB_TOKEN: ${{ github.token }}
