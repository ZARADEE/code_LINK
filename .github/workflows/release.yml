name: Build release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    # Apple-only rebuild tags are published by apple.yml; retain the Android key.
    if: ${{ !contains(github.ref_name, '-apple.') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check documentation
        run: python scripts/check-docs.py
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content android/app/src/main/AndroidManifest.xml
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($manifest.manifest.versionName)") { throw 'Tag differs from Android version' }
      - name: Fetch verified build tools
        run: python scripts/setup-tools.py
      - name: Install Rust for remote transport
        run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Select Rust and prepare Android native tools
        run: |
          rustup default 1.100.0
          ./scripts/setup-remote.ps1
      - name: Build Windows clients
        run: ./scripts/build-desktop.ps1
      - name: Build English Windows clients
        run: ./scripts/build-desktop.ps1 -Language en
      - name: Verify bundled Windows runtimes
        run: |
          python scripts/test-windows-package.py dist/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-windows-package.py dist/desktop-en
      - name: Test authenticated pairing confirmation
        run: dotnet run --project desktop/CodeLink.Smoke/CodeLink.Smoke.csproj --configuration Release -- --pairing-checks
      - name: Build Android test APK
        run: ./scripts/build-android.ps1
      - name: Build English Android test APK
        run: ./scripts/build-android.ps1 -Language en
      - name: Assemble clean packages and checksums
        run: python scripts/package-release.py
      - name: Launch extracted Windows release ZIPs
        run: |
          Get-ChildItem dist/releases/*/CodeLink-Windows-*.zip | ForEach-Object {
            python scripts/test-windows-package.py $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Packaged runtime validation failed: $_" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CodeLink-test-packages
          path: dist/releases/*/*
          if-no-files-found: error
          retention-days: 14
# CI generates a new Android test key. The maintainer publishes upgrades with the
# existing release key; a CI artifact must not silently replace that signed APK.
