[package]
name = "codelink-remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
